<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookUp — Flight Notification System</title>
  <meta name="description" content="LookUp is a minimal flight notification system built in Iași, Romania. Get notified when planes fly above you.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="layout">

    <header class="header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">LookUp</span>
      </div>
      <span class="header-status" id="statusText">—</span>
    </header>

    <main class="main">

      <!-- Left: Radar -->
      <section class="radar-section">
        <div class="radar-wrap">
          <div class="radar" id="radarScope">
            <div class="radar-ring ring-1"></div>
            <div class="radar-ring ring-2"></div>
            <div class="radar-ring ring-3"></div>
            <div class="radar-line line-h"></div>
            <div class="radar-line line-v"></div>
            <div class="radar-sweep" id="radarSweep"></div>
            <div class="radar-user" id="userLocationOverlay">
              <div class="proximity-zone" id="proximityZone"></div>
              <div class="user-dot" id="userMarker"></div>
            </div>
            <div class="markers-overlay" id="markersOverlay"></div>
          </div>
        </div>
        <p class="radar-caption" id="radarCaption">Scope inactive</p>
      </section>

      <!-- Right: Controls + List -->
      <section class="panel">

        <div class="panel-top">
          <div>
            <h1 class="panel-title">LookUp</h1>
            <p class="panel-sub">A flight notification system<br>from Iași, Romania</p>
          </div>
          <span class="flight-pill" id="flightCount">0 flights</span>
        </div>

        <!-- Location controls -->
        <div class="controls-group">
          <div class="controls-row">
            <button class="btn btn-outline" id="detectLocationBtn">Detect Location</button>
            <button class="btn btn-outline" id="requestNotifyBtn">
              <span id="notifyBtnText">Enable Alerts</span>
            </button>
          </div>

          <div class="coord-row">
            <div class="field">
              <label for="userLat">Latitude</label>
              <input type="number" id="userLat" step="0.0001" value="47.1585">
            </div>
            <div class="field">
              <label for="userLon">Longitude</label>
              <input type="number" id="userLon" step="0.0001" value="27.6014">
            </div>
            <button class="btn btn-apply" id="updateCoordsBtn">Apply</button>
          </div>

          <div class="slider-row">
            <label for="alertRadiusSlider">Radius: <strong id="radiusVal">5.0 km</strong></label>
            <input type="range" id="alertRadiusSlider" min="1" max="15" step="0.5" value="5">
          </div>
        </div>

        <!-- Scan button -->
        <button class="btn btn-scan" id="scanBtn">Scan Skies</button>

        <!-- Flight list -->
        <div class="flight-list" id="telemetryList">
          <div class="empty-msg" id="emptyState">
            <p>Press <strong>Scan Skies</strong> to check what's above you.</p>
          </div>
        </div>

      </section>
    </main>

    <footer class="footer">
      <span>LookUp · Iași, Romania · powered by <a href="https://opensky-network.org" target="_blank">OpenSky</a></span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
